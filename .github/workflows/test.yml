name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # wanderers-core's reusable checks: the vendored core matches its pin (and the published release), then syntax check, ESLint and
  # unit tests. The JSDoc type check is off until the older tool files are JSDoc-clean (npm run types lists what's left).
  checks:
    uses: cocoomg11/wanderers-core/.github/workflows/module-checks.yml@v0.2.0
    with:
      types: false
